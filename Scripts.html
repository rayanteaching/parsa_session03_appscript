<script>let appData=null;google.script.run.withSuccessHandler(init).withFailureHandler(showError).getInitialData();function init(data){appData=data;document.getElementById('status').textContent=data.nextAttemptType==='PRACTICE'?'این تلاش تمرینی است؛ نمره رسمی تلاش اول تغییر نمی‌کند.':'این تلاش رسمی شماست.';renderQuestions(data.questions);renderRepairs(data.repairTasks);renderFinal(data.finalTask);document.getElementById('lessonForm').hidden=false;}function renderQuestions(qs){let root=document.getElementById('questions');qs.forEach((q,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML='<b>'+(i+1)+'. '+esc(q.prompt)+'</b>'+(q.code?'<pre class="code">'+esc(q.code)+'</pre>':'')+q.options.map((o,j)=>'<label class="option"><input type="radio" name="'+q.id+'" value="'+j+'"> '+esc(o)+'</label>').join('');root.appendChild(d);});}function renderRepairs(tasks){let r=document.getElementById('repairs');tasks.forEach((t,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+esc(t.title)+'</h3><p>'+esc(t.prompt)+'</p><pre class="code">'+esc(t.starter)+'</pre><textarea id="repair'+i+'" dir="ltr">'+esc(t.starter)+'</textarea>';r.appendChild(d);});}function renderFinal(t){document.getElementById('finalTask').innerHTML='<div class="card"><p>'+esc(t.prompt)+'</p><pre class="code">'+esc(t.starter)+'</pre><p>خروجی مورد انتظار:</p><pre class="code">'+esc(t.expectedOutput)+'</pre><textarea id="finalCode" dir="ltr">'+esc(t.starter)+'</textarea></div>';}document.getElementById('lessonForm').addEventListener('submit',function(e){e.preventDefault();let answers={};for(let q of appData.questions){let x=document.querySelector('input[name="'+q.id+'"]:checked');if(!x)return alert('همه سؤال‌های تستی را پاسخ بده.');answers[q.id]=Number(x.value);}let debugCodes=appData.repairTasks.map((_,i)=>document.getElementById('repair'+i).value);let finalCode=document.getElementById('finalCode').value;document.getElementById('submitBtn').disabled=true;google.script.run.withSuccessHandler(showResult).withFailureHandler(showError).submitLesson({mcqAnswers:answers,debugCodes:debugCodes,finalCode:finalCode});});function showResult(r){document.getElementById('result').innerHTML='<div class="result"><b>نمره تستی: '+r.mcqScore+' / '+r.mcqMax+'</b><p>'+esc(r.message)+'</p></div>';document.getElementById('submitBtn').disabled=false;}function showError(e){document.getElementById('status').textContent='خطا: '+(e&&e.message?e.message:e);document.getElementById('submitBtn').disabled=false;}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}</script>
